[package]
name = "flatzinc-serde"
version = "0.6.0"
description = "FlatZinc serialization and deserialization"
authors = [
	"Jip J. Dekker <jip@dekker.one>",
	"Jason Nguyen <admin@cyderize.org>",
]

homepage = "https://www.minizinc.org/"
repository = "https://github.com/MiniZinc/flatzinc-serde"
license = "MPL-2.0"
keywords = ["minizinc", "flatzinc", "serde", "optimization", "serialization"]
categories = ["parsing", "science"]
exclude = ["/corpus"]

edition = "2024"

[features]
default = ["serde"]
serde = ["dep:serde"]
fzn = ["dep:winnow"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }
rangelist = { version = "0.5.0" }
winnow = { version = "1.0.3", optional = true }

[dev-dependencies]
serde_json = "1.0.150"
expect-test = "1.5.1"
ustr = { version = "1.1.0", features = ["serde"] }

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

[lints.clippy]
allow_attributes_without_reason = "deny"
cargo_common_metadata = "warn"
clone_on_ref_ptr = "warn"
default_union_representation = "deny"
implicit_clone = "warn"
missing_docs_in_private_items = "warn"
mixed_read_write_in_expression = "deny"
negative_feature_names = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_feature_names = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_chars_any = "warn"
tests_outside_test_module = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unseparated_literal_suffix = "warn"
unnecessary_safety_doc = "warn"
wildcard_dependencies = "warn"
wrong_self_convention = "warn"

[package.metadata.docs.rs]
all-features = true
